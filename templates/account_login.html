<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title or "Employee Login" }}</title>
    <style>
        :root {
            --ink: #102033;
            --muted: #657186;
            --line: #dfe7ef;
            --panel: #ffffff;
            --soft: #eef3f6;
            --brand: #236b5b;
        }

        * { box-sizing: border-box; }

        body {
            align-items: center;
            background: var(--soft);
            color: var(--ink);
            display: flex;
            font-family: Arial, Helvetica, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            max-width: 440px;
            padding: 24px;
            width: 100%;
        }

        h1 { margin: 0 0 8px; }
        p { color: var(--muted); margin-top: 0; }

        .field {
            display: grid;
            gap: 6px;
            margin-bottom: 14px;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        input {
            border: 1px solid var(--line);
            border-radius: 8px;
            font: inherit;
            padding: 10px 12px;
            width: 100%;
        }

        button {
            background: var(--brand);
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            padding: 10px 14px;
            width: 100%;
        }

        .error {
            background: #fff1f1;
            border: 1px solid #f0c4c4;
            border-radius: 8px;
            color: #8a1d1d;
            margin-bottom: 14px;
            padding: 10px 12px;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Employee Login</h1>
        <p>Use your work email and password to view assets assigned to you.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/account/login">
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit">Log in</button>
        </form>
    </main>
</body>
</html>
