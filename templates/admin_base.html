<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title or "Asset Admin" }}</title>
    <style>
        :root {
            --bg: #eef2f6;
            --panel: #ffffff;
            --panel-soft: #f8fafc;
            --text: #172033;
            --muted: #5f6b7a;
            --line: #d7dee7;
            --brand: #0f6c5c;
            --brand-dark: #0c5448;
            --accent: #d9efe8;
            --warn: #f3d7d3;
            --shadow: 0 18px 40px rgba(23, 32, 51, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(15, 108, 92, 0.1), transparent 28%),
                linear-gradient(180deg, #f7fafc 0%, var(--bg) 100%);
            color: var(--text);
        }

        .layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: #12372f;
            color: #f3f7f5;
            padding: 28px 22px;
        }

        .sidebar h1 {
            margin: 0 0 10px;
            font-size: 26px;
            line-height: 1.1;
        }

        .sidebar p {
            margin: 0 0 24px;
            color: rgba(243, 247, 245, 0.72);
            line-height: 1.5;
        }

        .session-box {
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(243, 247, 245, 0.88);
            font-size: 14px;
        }

        .session-box a {
            color: #d5fff4;
            text-decoration: none;
        }

        .nav {
            display: grid;
            gap: 10px;
        }

        .nav a {
            color: #f3f7f5;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav a:hover,
        .nav a.active {
            background: rgba(217, 239, 232, 0.18);
            border-color: rgba(217, 239, 232, 0.35);
        }

        .content {
            padding: 28px;
        }

        .hero {
            background: linear-gradient(135deg, #ffffff 0%, #f3fbf8 100%);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .hero h2 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            max-width: 760px;
            line-height: 1.6;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .panel,
        .stat {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .stat {
            padding: 20px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .stat-value {
            margin-top: 10px;
            font-size: 34px;
            font-weight: 700;
        }

        .panel {
            padding: 22px;
        }

        .panel h3 {
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 20px;
        }

        .muted {
            color: var(--muted);
        }

        .list {
            display: grid;
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .list li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            background: var(--panel-soft);
            border: 1px solid #e8edf3;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .search {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search input {
            min-width: 280px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #fff;
            font: inherit;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--brand);
            color: white;
            font: inherit;
        }

        .btn.secondary {
            background: #e6edf2;
            color: var(--text);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid #e7edf4;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background: var(--accent);
            color: var(--brand-dark);
        }

        .badge.warn {
            background: var(--warn);
            color: #8a2f22;
        }

        .two-column {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                padding-bottom: 16px;
            }

            .content {
                padding: 18px;
            }

            .hero {
                padding: 20px;
            }

            .search input {
                min-width: 100%;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h1>Scanventory Admin</h1>
            <p>Operational asset management workspace built on Supabase with controlled Excel synchronization.</p>
            {% if admin_username %}
            <div class="session-box">
                Signed in as <strong>{{ admin_username }}</strong><br>
                <a href="/admin/logout">Log out</a>
            </div>
            {% endif %}
            <nav class="nav">
                <a href="/admin" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
                <a href="/admin/assets" class="{% if active_page == 'assets' %}active{% endif %}">Assets</a>
                <a href="/admin/reports" class="{% if active_page == 'reports' %}active{% endif %}">Reports</a>
                <a href="/admin/sync" class="{% if active_page == 'sync' %}active{% endif %}">Excel Sync</a>
                <a href="/miniapp">Mini App</a>
            </nav>
        </aside>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
